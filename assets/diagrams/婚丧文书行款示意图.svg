<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 580" width="1280" height="580" role="img" aria-label="婚丧文书行款示意图">
  <title>婚丧文书行款示意图</title>
  <desc>以讣告为例，标示文种标题、事实栏、日程栏、亲属自称、落款年月等行款要项。</desc>

  <style>
    text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
    .bg{fill:#FFFFFF}
    .title{font-size:26px;font-weight:700;fill:#2B2B2B}
    .subtitle{font-size:14px;fill:#7A6A52}
    .rule{stroke:#E4DDD1;stroke-width:1}
    .paper{fill:#FAFAF8;stroke:#C9C4BA;stroke-width:1.5}
    .plabel{font-size:12px;fill:#9A958A}
    .doc-title{font-size:20px;font-weight:700;fill:#3A3126;letter-spacing:6px}
    .doc-line{font-size:14px;fill:#4A4A4A}
    .doc-sign{font-size:14px;font-weight:700;fill:#3A3126}
    .an-t{font-size:13.5px;font-weight:700;fill:#A0764A}
    .an-n{font-size:11.5px;fill:#6E6A62}
    .lead{stroke:#C9A97A;stroke-width:1.2;stroke-dasharray:5 4;fill:none}
    .caption{font-size:12.5px;fill:#7A6A52}
  </style>

  <rect class="bg" x="0" y="0" width="1280" height="580"/>

  <text class="title" x="50" y="58">婚丧文书行款示意图</text>
  <text class="subtitle" x="50" y="86">以讣告为例；喜事文书同一体式，惟用红笺朱印，丧事用白纸素笺</text>
  <line class="rule" x1="50" y1="104" x2="1230" y2="104"/>

  <text class="plabel" x="120" y="136">示例　讣告（丧事用白纸素笺）</text>
  <rect class="paper" x="120" y="150" width="640" height="310" rx="6"/>

  <text class="doc-title" x="440" y="200" text-anchor="middle">訃　聞</text>
  <text class="doc-line" x="720" y="240" text-anchor="end">先父〇公諱〇〇，因病醫治無效，</text>
  <text class="doc-line" x="720" y="268" text-anchor="end">於〇年〇月〇日〇時〇分　壽終正寢，</text>
  <text class="doc-line" x="720" y="296" text-anchor="end">享年〇〇歲。</text>
  <text class="doc-line" x="720" y="324" text-anchor="end">謹擇於〇月〇日〇時入殮，</text>
  <text class="doc-line" x="720" y="352" text-anchor="end">〇月〇日〇時開吊，〇月〇日〇時出殯。</text>
  <text class="doc-sign" x="720" y="394" text-anchor="end">孤子　〇〇　泣血謹告</text>
  <text class="doc-sign" x="720" y="426" text-anchor="end">〇年〇月〇日</text>

  <!-- 标注引线 -->
  <polyline class="lead" points="765,200 784,200 800,200"/>
  <polyline class="lead" points="765,282 784,282 800,282"/>
  <polyline class="lead" points="765,352 784,352 800,330"/>
  <polyline class="lead" points="765,394 784,394 800,392"/>
  <polyline class="lead" points="765,426 784,426 800,440"/>

  <!-- 标注 -->
  <text class="an-t" x="804" y="200">文种标题</text>
  <text class="an-n" x="804" y="220">「訃」字居首，明示文书性质</text>

  <text class="an-t" x="804" y="282">事实栏</text>
  <text class="an-n" x="804" y="302">亡者名讳、生卒、享年</text>

  <text class="an-t" x="804" y="330">日程栏</text>
  <text class="an-n" x="804" y="350">入殮、開吊、出殯之日期时辰</text>

  <text class="an-t" x="804" y="392">亲属自称</text>
  <text class="an-n" x="804" y="412">依服制用孤子、哀子、孤哀子</text>

  <text class="an-t" x="804" y="440">落款年月</text>
  <text class="an-n" x="804" y="460">具名、年月日，或加钤印</text>

  <line class="rule" x1="50" y1="500" x2="1230" y2="500"/>
  <text class="caption" x="50" y="526">行款通则：直书右起；遇尊长称谓另起一行顶格（抬头）；文中避尊长名讳；喜事用红笺，丧事用白纸。</text>
  <text class="caption" x="50" y="550">投送与回复：专人投送，忌请人转交；受者或具回帖（喜事回帖、丧事谢帖）。</text>
</svg>
