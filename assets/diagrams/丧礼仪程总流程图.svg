<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="丧礼仪程总流程图">
  <title>丧礼仪程总流程图</title>
  <desc>自初丧、入殓、停灵、出殡下葬至葬后祭祀的五段仪程与各段主要节目示意图。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#C9A97A"/>
    </marker>
  </defs>

  <style>
    text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
    .bg{fill:#FFFFFF}
    .title{font-size:26px;font-weight:700;fill:#2B2B2B}
    .subtitle{font-size:14px;fill:#7A6A52}
    .rule{stroke:#E4DDD1;stroke-width:1}
    .head{fill:#F6EFE4;stroke:#C9A97A;stroke-width:1.5}
    .head-t{font-size:19px;font-weight:700;fill:#3A3126}
    .num{font-size:13px;font-weight:700;fill:#FFFFFF}
    .item{fill:#FBF8F3;stroke:#E0D4C0;stroke-width:1}
    .item-t{font-size:12.5px;fill:#4A4A4A}
    .caption{font-size:13px;fill:#7A6A52}
  </style>

  <rect class="bg" x="0" y="0" width="1280" height="480"/>

  <text class="title" x="50" y="58">丧礼仪程总流程图</text>
  <text class="subtitle" x="50" y="86">初丧 → 入殓 → 停灵 → 出殡下葬 → 葬后祭祀，五段相承</text>
  <line class="rule" x1="50" y1="104" x2="1230" y2="104"/>

  <!-- 段头 -->
  <rect class="head" x="50"   y="140" width="200" height="56" rx="10"/>
  <rect class="head" x="295"  y="140" width="200" height="56" rx="10"/>
  <rect class="head" x="540"  y="140" width="200" height="56" rx="10"/>
  <rect class="head" x="785"  y="140" width="200" height="56" rx="10"/>
  <rect class="head" x="1030" y="140" width="200" height="56" rx="10"/>

  <circle cx="76"   cy="168" r="12" fill="#C9A97A"/>
  <text class="num" x="76"   y="173" text-anchor="middle">1</text>
  <text class="head-t" x="160"  y="175" text-anchor="middle">初丧</text>
  <circle cx="321"  cy="168" r="12" fill="#C9A97A"/>
  <text class="num" x="321"  y="173" text-anchor="middle">2</text>
  <text class="head-t" x="405"  y="175" text-anchor="middle">入殓</text>
  <circle cx="566"  cy="168" r="12" fill="#C9A97A"/>
  <text class="num" x="566"  y="173" text-anchor="middle">3</text>
  <text class="head-t" x="650"  y="175" text-anchor="middle">停灵</text>
  <circle cx="811"  cy="168" r="12" fill="#C9A97A"/>
  <text class="num" x="811"  y="173" text-anchor="middle">4</text>
  <text class="head-t" x="895"  y="175" text-anchor="middle">出殡下葬</text>
  <circle cx="1056" cy="168" r="12" fill="#C9A97A"/>
  <text class="num" x="1056" y="173" text-anchor="middle">5</text>
  <text class="head-t" x="1140" y="175" text-anchor="middle">葬后祭祀</text>

  <!-- 段间箭头 -->
  <line x1="250" y1="168" x2="289" y2="168" stroke="#C9A97A" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="495" y1="168" x2="534" y2="168" stroke="#C9A97A" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="740" y1="168" x2="779" y2="168" stroke="#C9A97A" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="985" y1="168" x2="1024" y2="168" stroke="#C9A97A" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 节目标 -->
  <rect class="item" x="50" width="200" y="220" height="34" rx="8"/>
  <text class="item-t" x="150" y="241" text-anchor="middle">属纩、易箦</text>
  <rect class="item" x="50" width="200" y="264" height="34" rx="8"/>
  <text class="item-t" x="150" y="285" text-anchor="middle">复礼（招魂）</text>
  <rect class="item" x="50" width="200" y="308" height="34" rx="8"/>
  <text class="item-t" x="150" y="329" text-anchor="middle">沐浴、饭含</text>
  <rect class="item" x="50" width="200" y="352" height="34" rx="8"/>
  <text class="item-t" x="150" y="373" text-anchor="middle">袭尸、设奠</text>

  <rect class="item" x="295" width="200" y="220" height="34" rx="8"/>
  <text class="item-t" x="395" y="241" text-anchor="middle">小殓</text>
  <rect class="item" x="295" width="200" y="264" height="34" rx="8"/>
  <text class="item-t" x="395" y="285" text-anchor="middle">大殓（举尸入棺）</text>
  <rect class="item" x="295" width="200" y="308" height="34" rx="8"/>
  <text class="item-t" x="395" y="329" text-anchor="middle">盖棺、钉棺</text>
  <rect class="item" x="295" width="200" y="352" height="34" rx="8"/>
  <text class="item-t" x="395" y="373" text-anchor="middle">开光</text>

  <rect class="item" x="540" width="200" y="220" height="34" rx="8"/>
  <text class="item-t" x="640" y="241" text-anchor="middle">灵堂布置</text>
  <rect class="item" x="540" width="200" y="264" height="34" rx="8"/>
  <text class="item-t" x="640" y="285" text-anchor="middle">守灵、朝夕奠</text>
  <rect class="item" x="540" width="200" y="308" height="34" rx="8"/>
  <text class="item-t" x="640" y="329" text-anchor="middle">佛事超度</text>
  <rect class="item" x="540" width="200" y="352" height="34" rx="8"/>
  <text class="item-t" x="640" y="373" text-anchor="middle">道场破狱</text>

  <rect class="item" x="785" width="200" y="220" height="34" rx="8"/>
  <text class="item-t" x="885" y="241" text-anchor="middle">择日、启灵</text>
  <rect class="item" x="785" width="200" y="264" height="34" rx="8"/>
  <text class="item-t" x="885" y="285" text-anchor="middle">摔盆、送葬</text>
  <rect class="item" x="785" width="200" y="308" height="34" rx="8"/>
  <text class="item-t" x="885" y="329" text-anchor="middle">路祭、棺罩</text>
  <rect class="item" x="785" width="200" y="352" height="34" rx="8"/>
  <text class="item-t" x="885" y="373" text-anchor="middle">落葬、封土</text>

  <rect class="item" x="1030" width="200" y="220" height="34" rx="8"/>
  <text class="item-t" x="1130" y="241" text-anchor="middle">复三、圆坟</text>
  <rect class="item" x="1030" width="200" y="264" height="34" rx="8"/>
  <text class="item-t" x="1130" y="285" text-anchor="middle">做七（七七）</text>
  <rect class="item" x="1030" width="200" y="308" height="34" rx="8"/>
  <text class="item-t" x="1130" y="329" text-anchor="middle">百日、周年</text>
  <rect class="item" x="1030" width="200" y="352" height="34" rx="8"/>
  <text class="item-t" x="1130" y="373" text-anchor="middle">除服、禫祭</text>

  <line class="rule" x1="50" y1="400" x2="1230" y2="400"/>
  <text class="caption" x="50" y="426">五段前后相承，各段节目在实际丧事中或有增省；少数民族丧葬之葬式与祭祀另成体系，不以五段为限。</text>
  <text class="caption" x="50" y="452">贯穿全程者：择吉（02-10）· 称谓（02-09）· 器物明器（02-07）· 丧服规制（02-08）</text>
</svg>
