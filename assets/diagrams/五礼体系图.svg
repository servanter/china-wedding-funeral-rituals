<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="五礼体系图">
  <title>五礼体系图</title>
  <desc>《周礼》吉、凶、军、宾、嘉五礼的要义、内容与婚丧归属示意图。</desc>

  <style>
    text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
    .bg{fill:#FFFFFF}
    .title{font-size:26px;font-weight:700;fill:#2B2B2B}
    .subtitle{font-size:14px;fill:#7A6A52}
    .rule{stroke:#E4DDD1;stroke-width:1}
    .head{fill:#F6EFE4;stroke:#C9A97A;stroke-width:1.5}
    .head-a{fill:#C9A97A;stroke:#A0764A;stroke-width:1.5}
    .head-t{font-size:18px;font-weight:700;fill:#3A3126}
    .head-t-a{font-size:18px;font-weight:700;fill:#FFFFFF}
    .panel{fill:#FBF8F3;stroke:#E0D4C0;stroke-width:1}
    .ln{font-size:12px;fill:#4A4A4A}
    .sep{stroke:#E4DDD1;stroke-width:1}
    .own{font-size:12.5px;font-weight:700;fill:#A0764A}
    .own-n{font-size:12.5px;fill:#8A7E6C}
    .caption{font-size:12.5px;fill:#7A6A52}
  </style>

  <rect class="bg" x="0" y="0" width="1280" height="520"/>

  <text class="title" x="50" y="58">五礼体系图</text>
  <text class="subtitle" x="50" y="86">《周礼·春官·大宗伯》以吉、凶、军、宾、嘉五类统摄一切礼仪</text>
  <line class="rule" x1="50" y1="104" x2="1230" y2="104"/>

  <!-- 吉礼 -->
  <rect class="head" x="50" y="140" width="224" height="44" rx="10"/>
  <text class="head-t" x="162" y="169" text-anchor="middle">吉礼</text>
  <rect class="panel" x="50" y="192" width="224" height="210" rx="12"/>
  <text class="ln" x="66" y="226">要义　事邦国之鬼神祇</text>
  <text class="ln" x="66" y="252">对象　天神、地祇、人鬼</text>
  <text class="ln" x="66" y="278">祭法　郊祀、禋祀、血祭</text>
  <text class="ln" x="66" y="304">关联　家祭·祠祭·墓祭</text>
  <line class="sep" x1="66" y1="330" x2="258" y2="330"/>
  <text class="own-n" x="66" y="366">祭祀之礼</text>

  <!-- 凶礼 -->
  <rect class="head-a" x="289" y="140" width="224" height="44" rx="10"/>
  <text class="head-t-a" x="401" y="169" text-anchor="middle">凶礼</text>
  <rect class="panel" x="289" y="192" width="224" height="210" rx="12"/>
  <text class="ln" x="305" y="226">要义　哀邦国之忧</text>
  <text class="ln" x="305" y="252">内容　丧、荒、吊、禬、恤</text>
  <text class="ln" x="305" y="278">核心　丧礼仪节最繁</text>
  <text class="ln" x="305" y="304">关联　五服、丧服规制</text>
  <line class="sep" x1="305" y1="330" x2="497" y2="330"/>
  <text class="own" x="305" y="366">★ 丧葬属此</text>

  <!-- 军礼 -->
  <rect class="head" x="528" y="140" width="224" height="44" rx="10"/>
  <text class="head-t" x="640" y="169" text-anchor="middle">军礼</text>
  <rect class="panel" x="528" y="192" width="224" height="210" rx="12"/>
  <text class="ln" x="544" y="226">要义　威邦国</text>
  <text class="ln" x="544" y="252">内容　大师、大均、大田</text>
  <text class="ln" x="544" y="278">　　　大役、大封</text>
  <text class="ln" x="544" y="304">关联　讲武、田猎、誓师</text>
  <line class="sep" x1="544" y1="330" x2="736" y2="330"/>
  <text class="own-n" x="544" y="366">与婚丧无涉</text>

  <!-- 宾礼 -->
  <rect class="head" x="767" y="140" width="224" height="44" rx="10"/>
  <text class="head-t" x="879" y="169" text-anchor="middle">宾礼</text>
  <rect class="panel" x="767" y="192" width="224" height="210" rx="12"/>
  <text class="ln" x="783" y="226">要义　亲邦国</text>
  <text class="ln" x="783" y="252">内容　朝、聘、会、同</text>
  <text class="ln" x="783" y="278">关联　朝贡、册封、和亲</text>
  <text class="ln" x="783" y="304">　　　和亲影响跨族婚俗</text>
  <line class="sep" x1="783" y1="330" x2="975" y2="330"/>
  <text class="own-n" x="783" y="366">与婚俗间接相关</text>

  <!-- 嘉礼 -->
  <rect class="head-a" x="1006" y="140" width="224" height="44" rx="10"/>
  <text class="head-t-a" x="1118" y="169" text-anchor="middle">嘉礼</text>
  <rect class="panel" x="1006" y="192" width="224" height="210" rx="12"/>
  <text class="ln" x="1022" y="226">要义　亲万民</text>
  <text class="ln" x="1022" y="252">内容　饮食、冠昏、宾射</text>
  <text class="ln" x="1022" y="278">　　　飨燕、脤膰、贺庆</text>
  <text class="ln" x="1022" y="304">关联　乡饮酒、士冠礼</text>
  <line class="sep" x1="1022" y1="330" x2="1214" y2="330"/>
  <text class="own" x="1022" y="366">★ 婚嫁属此</text>

  <line class="rule" x1="50" y1="440" x2="1230" y2="440"/>
  <text class="caption" x="50" y="466">婚嫁属嘉礼、丧葬属凶礼，为本资料库两编之分野；军礼与婚丧无涉，宾礼则因和亲而与婚俗间接相关。</text>
  <text class="caption" x="50" y="492">五礼之名始见《周礼·春官·大宗伯》，历代礼典（《大唐开元礼》《大清通礼》等）皆依此编次。</text>
</svg>
